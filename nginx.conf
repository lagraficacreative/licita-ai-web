# Bloque que SIRVE la web (default_server: atiende lalicita.ai y cualquier host no redirigido)
server {
    listen 80 default_server;
    server_name lalicita.ai _;

    root /usr/share/nginx/html;
    index index.html;

    # HTML y rutas limpias (/producto, /producto.html, /): no cachear en el navegador,
    # pero sí re-validar barato con ETag (304 si no cambió). Así los visitantes recurrentes
    # ven siempre la versión más reciente sin Ctrl+Shift+R.
    #
    # Nota: al poner add_header dentro de un location, los add_header del server{} dejan
    # de aplicar aquí; por eso los repetimos. 'always' incluye respuestas 304.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Estáticos con hash o estables (css, js, imágenes, iconos, fuentes): caché larga.
    # Si cambian, el deploy sustituye el archivo y el navegador lo re-pide al faltar en caché.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Página 404 -> redirige a inicio (opcional)
    error_page 404 /index.html;

    # Seguridad básica (aplica a respuestas no capturadas por los location de arriba)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

# Redirección 301 SOLO del dominio antiguo + www → dominio nuevo canónico (SEO)
server {
    listen 80;
    server_name licita.lagrafica.ai www.licita.lagrafica.ai www.lalicita.ai;
    return 301 https://lalicita.ai$request_uri;
}
