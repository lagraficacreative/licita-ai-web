# Bloque que SIRVE la web (default_server: atiende lalicita.ai y cualquier host no redirigido)
server {
    listen 80 default_server;
    server_name lalicita.ai _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirecciones relativas (detrás de Traefik/HTTPS no queremos Location: http://...:80)
    absolute_redirect off;

    # 301 de rutas antiguas o mal escritas → páginas reales (no romper enlaces externos)
    location = /sobre-nosotros      { return 301 /sobre.html; }
    location = /politica-privacidad { return 301 /privacidad.html; }
    location = /buscador            { return 301 https://app.lalicita.ai/buscador$is_args$args; }
    # El registro vive en la app: /registre.html (catalán, antiguo) y /registro.html → app
    location = /registre.html       { return 301 https://app.lalicita.ai/registro.html$is_args$args; }
    location = /registro.html       { return 301 https://app.lalicita.ai/registro.html$is_args$args; }

    # Permite abrir /producto en vez de /producto.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cache de estáticos (css)
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Página 404 -> redirige a inicio (opcional)
    error_page 404 /index.html;

    # Seguridad básica
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
}

# Redirección 301 SOLO del dominio antiguo + www → dominio nuevo canónico (SEO)
server {
    listen 80;
    server_name licita.lagrafica.ai www.licita.lagrafica.ai www.lalicita.ai;
    return 301 https://lalicita.ai$request_uri;
}
